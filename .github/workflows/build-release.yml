name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without v
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Resolve version and build artifacts
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '${{ github.ref_name }}'.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') { throw "Invalid SemVer: $version" }
          .\gradlew.bat clean test buildWindowsInstaller "-Pversion=$version" "-PappfleetRepositoryUrl=https://github.com/${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: AppFleet-release-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
      - name: Publish GitHub Release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\scripts\publish-github-release.ps1 -Repository '${{ github.repository }}' -Tag '${{ github.ref_name }}' -ReleaseDirectory "dist\release\$version"
